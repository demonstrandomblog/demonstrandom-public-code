[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "demonstrandom-allometry"
version = "0.1.0"
description = "Experimental PanTHERIA mass and oxygen-consumption plotting helper"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["allometry"]
include-package-data = true

[tool.setuptools.package-dir]
allometry = "."

[tool.setuptools.package-data]
allometry = ["README.md", "LICENSE", "NOTICE", "provenance.json", "requirements.txt"]
