[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demonstrandom-game-control"
version = "0.0.0.dev0"
description = "Experimental game-control examples from Engineering Game Types"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Kevin T. Procopio"}]
requires-python = ">=3.10"
dependencies = ["numpy", "sympy", "scipy", "torch"]

[project.optional-dependencies]
polynomial = ["z3-solver"]

[tool.setuptools.packages.find]
where = ["src"]
