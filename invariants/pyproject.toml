[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "demonstrandom-invariants"
version = "0.1.0"
description = "Experimental sparse-polynomial and invariant-theory teaching tools"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7", "sympy>=1.12"]

[tool.setuptools]
packages = ["invariants", "invariants.groups"]
include-package-data = true

[tool.setuptools.package-dir]
invariants = "."

[tool.setuptools.package-data]
invariants = ["README.md", "provenance.json", "requirements.txt", "LICENSE", "NOTICE"]
